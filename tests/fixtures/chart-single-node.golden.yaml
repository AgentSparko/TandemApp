# Source: tandemapp/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t-tandemapp
  labels:
    helm.sh/chart: tandemapp-0.1.0
    app.kubernetes.io/name: tandemapp
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: public
  rules:
    - host: "app.example.com"
      http:
        paths:
          # never routed to the controller: a Service with no endpoints answers 503
          - path: /chat-engine
            pathType: Prefix
            backend:
              service:
                name: t-tandemapp-blocked
                port:
                  number: 80
          # never routed to the controller: a Service with no endpoints answers 503
          - path: /plugin-backends
            pathType: Prefix
            backend:
              service:
                name: t-tandemapp-blocked
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: t-tandemapp
                port:
                  name: http
