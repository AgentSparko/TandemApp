# Source: tandemapp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t-tandemapp
  labels:
    helm.sh/chart: tandemapp-0.1.0
    app.kubernetes.io/name: tandemapp
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
spec:
  # one volume, one writer: never two pods at once
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tandemapp
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tandemapp
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: controller
      annotations:
        checksum/config: <sha256>
    spec:
      # a stable host name: the fleet and the topology name the controller's host by it
      hostname: t-tandemapp
      serviceAccountName: t-tandemapp
      # the token goes to the controller's container only (sandbox.mode kubernetes), not to the
      # init container or the MCP bridge
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: release
          image: docker.io/library/python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/etc/tandemapp/config/init.sh"]
          env:
            - name: TA_ROOT
              value: "/var/lib/tandemapp"
            - name: TA_RELEASE
              value: "0123456789ab"
            - name: TA_ARCHIVE_URL
              value: ""
            - name: TA_ARCHIVE_SHA256
              value: ""
            - name: TA_WAIT_S
              value: "1800"
            - name: TA_REQUIREMENTS
              value: "cryptography psutil"
            - name: TA_CHAT_DIR
              value: "data/chat"
            - name: TA_CONDUCTOR_DIR
              value: "/var/lib/tandemapp/conductor"
            - name: HOME
              value: "/var/lib/tandemapp/home"
            - name: TA_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/tandemapp}
            - {name: config, mountPath: /etc/tandemapp/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: trust, mountPath: /etc/tandemapp/trust, readOnly: true}
      containers:
        - name: controller
          image: docker.io/library/python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/var/lib/tandemapp/current/packaging/linux/tandem-app.sh"]
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
            - name: egress
              containerPort: 3128
              protocol: TCP
          env:
            - {name: TANDEM_APP_STATE, value: "/var/lib/tandemapp/state"}
            - {name: TANDEM_APP_PYTHON, value: "/var/lib/tandemapp/current/venv/bin/python"}
            - {name: TANDEM_HOST, value: "0.0.0.0"}
            - {name: TANDEM_PORT, value: "8091"}
            - {name: TANDEM_CONDUCTOR, value: "/var/lib/tandemapp/conductor"}
            - {name: TANDEM_CHAT, value: "own"}
            - {name: HOME, value: "/var/lib/tandemapp/home"}
            - {name: SSL_CERT_FILE, value: "/var/lib/tandemapp/ca/bundle.pem"}
            - name: TANDEM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: t-tandemapp-admin
                  key: admin-token
            - {name: TANDEM_BACKENDS, value: "engine"}
            - {name: TANDEM_BACKEND_ENGINE_KIND, value: "generic"}
            - {name: TANDEM_BACKEND_ENGINE_URL, value: "http://engine.example.com:8000/v1"}
            - {name: TANDEM_NODE_AGENT, value: "off"}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "4"
              memory: 3Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/tandemapp}
            - {name: tmp, mountPath: /tmp}
            - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        - name: mcp-tools
          image: docker.io/library/python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
          imagePullPolicy: IfNotPresent
          # a pod is Ready only while every container runs, so a restarting bridge would take the
          # Service (the page, the API) down with it. This container never exits: the loop starts
          # the bridge again 5 s after it ends, and there is no probe to restart it (README: MCP bridge)
          command:
            - sh
            - -c
            - |
              trap 'kill "$c" 2>/dev/null; wait "$c"; exit 0' TERM INT
              while :; do
                python3 -u /etc/tandemapp/config/mcp-stdio-http.py "$@" & c=$!
                wait "$c"; echo "[bridge] exited ($?); again in 5 s" >&2
                sleep 5 & c=$!; wait "$c"
              done
            - mcp-bridge
            - --host
            - 127.0.0.1
            - --port
            - "8031"
            - --path
            - "/mcp"
            - --
            - "/var/lib/tandemapp/mcp/bin/server"
            - "--stdio"
          env:
            - {name: HOME, value: "/var/lib/tandemapp/home"}
            - {name: SSL_CERT_FILE, value: "/var/lib/tandemapp/ca/bundle.pem"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 64Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/tandemapp}
            - {name: config, mountPath: /etc/tandemapp/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: t-tandemapp-data
        - name: config
          configMap:
            name: t-tandemapp-config
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: trust
          configMap:
            name: t-tandemapp-trust
            items:
              - {key: ca.pem, path: ca.pem}
        # the ServiceAccount's token for chatd (its Role: pods, exec, logs in this namespace)
        - name: kube-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3607}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]

