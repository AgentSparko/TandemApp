# Source: tandemapp/templates/tests/test-health.yaml
apiVersion: v1
kind: Pod
metadata:
  name: t-tandemapp-test
  labels:
    helm.sh/chart: tandemapp-0.1.0
    app.kubernetes.io/name: tandemapp
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: docker.io/library/python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        limits: {cpu: 200m, memory: 128Mi}
      command:
        - python3
        - -c
        - |
          import json, urllib.request
          base = "http://t-tandemapp:80"
          with urllib.request.urlopen(base + "/health", timeout=10) as r:
              assert r.status == 200, r.status
              print("health", json.loads(r.read()).get("status"))
          with urllib.request.urlopen(base + "/dashboard/", timeout=10) as r:
              assert r.status == 200 and r.headers.get("X-Tandem-Bundle"), "no page"
              print("page bundle", r.headers.get("X-Tandem-Bundle"))

