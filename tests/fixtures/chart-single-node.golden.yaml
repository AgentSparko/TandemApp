# Source: tandemapp/templates/sandbox.yaml
# a sandbox pod: nothing reaches it (exec goes through the kubelet, not the pod network); it
# reaches only chatd's egress proxy in the controller's pod. No DNS: the proxy resolves names
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t-tandemapp-sandbox
  labels:
    helm.sh/chart: tandemapp-0.1.0
    app.kubernetes.io/name: tandemapp
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: chat-sandbox
      app.kubernetes.io/instance: t
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tandemapp
              app.kubernetes.io/instance: t
              app.kubernetes.io/component: controller
      ports:
        - port: 3128
          protocol: TCP
        - port: 3129
          protocol: TCP
