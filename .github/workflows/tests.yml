# The app suite and the page's build, run by hand only for now (workflow_dispatch).
# dashboard: dashboard-dist.yml builds the page (not in git, OPS-246), runs vitest, the size budget
# and the same-hash check.
# app: TandemApp installed with its host extra and no torch, from a copy that holds the page the
# dashboard job built; then each tests/test_*.py through tests/script_suite.py, two files at a
# time. A file that fails or runs no test fails the job. The checkout gets the same page after the
# install, for the tests that read it.
# plugin-examples: the plugin SDK's two examples and a scaffold of each kind installed and run
# through the plugin host, from the checkout (SRV-861); the app suite runs the same file too.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    uses: ./.github/workflows/dashboard-dist.yml

  app:
    name: app suite
    needs: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: The page from the dashboard job
        uses: actions/download-artifact@v4.1.8
        with:
          name: dashboard-dist
          path: ${{ runner.temp }}/dashboard-dist

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install TandemApp (no torch)
        run: |
          # build from a copy of the tracked files: a local build writes build/ and *.egg-info in place
          mkdir -p "$RUNNER_TEMP/app-src"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/app-src"
          cp -R "$RUNNER_TEMP/dashboard-dist" "$RUNNER_TEMP/app-src/dashboard/dist"
          python3 "$RUNNER_TEMP/app-src/tools/dashboard_bundle.py" verify \
            "$RUNNER_TEMP/app-src/dashboard/dist" --expect "${{ needs.dashboard.outputs.bundle }}"
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP/app-src[host]" pytest jsonschema pyyaml
          python -c "import importlib.util as u, sys; sys.exit('torch is installed' if u.find_spec('torch') else 0)"
          test -z "$(git status --porcelain --ignored)"
          cp -R "$RUNNER_TEMP/dashboard-dist" dashboard/dist

      - name: Run the app suite
        run: |
          set -o pipefail
          mkdir -p results/app-suite
          ls tests/test_*.py | xargs -P 2 -n 1 python tests/script_suite.py --all \
            --out results/app-suite/logs | tee results/app-suite/RESULT

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: app-suite-logs
          path: results/app-suite
          retention-days: 7

  plugin-examples:
    name: plugin examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Dependencies (no torch)
        run: python -m pip install "cryptography>=42" psutil jsonschema pyyaml

      - name: The SDK's examples through the plugin host
        run: |
          set -o pipefail
          mkdir -p results/plugin-examples
          python tests/script_suite.py --all --out results/plugin-examples/logs \
            tests/test_plugin_sdk.py | tee results/plugin-examples/RESULT

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: plugin-examples-logs
          path: results/plugin-examples
          retention-days: 7
