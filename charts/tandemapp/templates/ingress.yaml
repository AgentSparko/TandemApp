{{- if .Values.ingress.enabled }}
{{- $full := include "tandemapp.fullname" . }}
{{- /* ingress.blockedPaths plus the API paths of a protocol it does not route (ingress.api) */}}
{{- $blocked := include "tandemapp.blockedPaths" . | fromJsonArray }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $blocked }}
          # never routed to the controller: a Service with no endpoints answers 503
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-blocked
                port:
                  number: 80
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}
                port:
                  name: http
{{- if $blocked }}
---
# selects no pod: what the Ingress sends here has no endpoint and ends in a 503
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-blocked
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: none-blocked-path
  ports:
    - name: http
      port: 80
      targetPort: 9
{{- end }}
{{- end }}
