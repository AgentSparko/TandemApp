{{- if include "tandemapp.secretMade" . }}
{{- $name := include "tandemapp.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data (index $old.data .Values.auth.secretKey) }}
  {{ .Values.auth.secretKey }}: {{ index $old.data .Values.auth.secretKey }}
  {{- else if eq (include "tandemapp.authMode" .) "accounts" }}
  {{- /* a setup code: 20 characters of the app's alphabet (no 0, 1, I, L, O, U) */}}
  {{- $code := regexReplaceAll "[^ABCDEFGHJKMNPQRSTVWXYZ2-9]" (randAlphaNum 96 | upper) "" | trunc 20 }}
  {{- if ne (len $code) 20 }}{{ fail "the setup code came out short: render again" }}{{ end }}
  {{ .Values.auth.secretKey }}: {{ $code | b64enc }}
  {{- else }}
  {{ .Values.auth.secretKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
