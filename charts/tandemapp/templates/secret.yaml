{{- if and .Values.auth.create (not .Values.auth.existingSecret) }}
{{- $name := include "tandemapp.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data (index $old.data .Values.auth.secretKey) }}
  {{ .Values.auth.secretKey }}: {{ index $old.data .Values.auth.secretKey }}
  {{- else }}
  {{ .Values.auth.secretKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
