{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tandemapp.serviceAccountName" . }}
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# the controller needs no API access; sandbox.mode kubernetes binds a Role to it (sandbox.yaml)
automountServiceAccountToken: false
{{- end }}
