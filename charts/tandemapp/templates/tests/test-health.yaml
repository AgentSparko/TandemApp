apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tandemapp.fullname" . }}-test
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: {{ include "tandemapp.image" . }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        limits: {cpu: 200m, memory: 128Mi}
      command:
        - python3
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "tandemapp.fullname" . }}:{{ .Values.service.port }}"
          with urllib.request.urlopen(base + "/health", timeout=10) as r:
              assert r.status == 200, r.status
              print("health", json.loads(r.read()).get("status"))
          with urllib.request.urlopen(base + "/dashboard/", timeout=10) as r:
              assert r.status == 200 and r.headers.get("X-Tandem-Bundle"), "no page"
              print("page bundle", r.headers.get("X-Tandem-Bundle"))
