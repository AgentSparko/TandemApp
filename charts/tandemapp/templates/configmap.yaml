{{- include "tandemapp.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tandemapp.fullname" . }}-config
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
data:
  init.sh: |-
{{ .Files.Get "files/init.sh" | indent 4 }}
  mcp-stdio-http.py: |-
{{ .Files.Get "files/mcp-stdio-http.py" | indent 4 }}
  {{- if has (include "tandemapp.chatMode" .) (list "own" "off") }}
  chatd.env: |
    # chatd's env file, written to <state>/chatd.env by the init container (chart values chat.*,
    # sandbox.*), read while Chat is on (chat.mode own, or switched on from the page). No secret
    # goes here: chatd's forward key lives in its data folder.
    QSE_CHAT_DATA={{ printf "%s/%s" .Values.persistence.mountPath .Values.chat.dataDir }}
    # chatd gets few of the controller's variables: the CA bundle for its https MCP servers
    SSL_CERT_FILE={{ printf "%s/ca/bundle.pem" .Values.persistence.mountPath }}
    {{- if eq (toString .Values.sandbox.mode) "podman-socket" }}
    QSE_SANDBOX_SOCKET=/run/tandem-sandbox/podman.sock
    {{- else if eq (toString .Values.sandbox.mode) "kubernetes" }}
    {{- $k := .Values.sandbox.kubernetes }}
    {{- $labels := include "tandemapp.sandboxLabels" . | fromYaml }}
    # sandbox.mode kubernetes: a pod per sandbox through the Kubernetes API (chatd/k8s.py)
    QSE_SANDBOX_BACKEND=kubernetes
    QSE_K8S_API=https://kubernetes.default.svc
    QSE_K8S_NAMESPACE={{ .Release.Namespace }}
    QSE_K8S_LABELS={{ $labels | toJson }}
    QSE_K8S_CLAIM={{ include "tandemapp.claimName" . }}
    QSE_K8S_VOLUME_ROOT={{ .Values.persistence.mountPath }}
    QSE_K8S_SERVICE_ACCOUNT={{ include "tandemapp.fullname" . }}-sandbox
    QSE_K8S_IMAGE_PULL={{ $k.imagePullPolicy }}
    QSE_K8S_RUNTIME_CLASS={{ $k.runtimeClassName }}
    QSE_K8S_HOST_USERS={{ $k.hostUsers }}
    QSE_K8S_EGRESS_PORT={{ $k.egressPort }}
    QSE_K8S_CONTROLLER_PORT={{ .Values.controller.port }}
    QSE_SANDBOX_IMAGE={{ $k.image }}
    QSE_SANDBOX_UID={{ $k.runAsUser }}
    QSE_SANDBOX_CPUS={{ $k.cpus }}
    {{- with $k.memoryGiB }}
    QSE_SANDBOX_MEM_GB={{ . }}
    {{- end }}
    {{- with $k.maxRunning }}
    QSE_SANDBOX_MAX_RUNNING={{ . }}
    {{- end }}
    {{- else }}
    # sandbox.mode {{ .Values.sandbox.mode }}: no runtime socket in the pod, the sandbox tools say so
    QSE_SANDBOX_SOCKET=/run/tandem-sandbox/none.sock
    {{- end }}
    {{- range $k, $v := .Values.chat.env }}
    {{ $k }}={{ $v }}
    {{- end }}
  {{- end }}
---
{{- if and (or .Values.trust.extraCA) (not .Values.trust.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tandemapp.fullname" . }}-trust
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
data:
  {{ .Values.trust.configMapKey }}: |
{{ .Values.trust.extraCA | indent 4 }}
{{- end }}
