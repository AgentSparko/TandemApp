{{- if eq (toString .Values.sandbox.mode) "kubernetes" }}
{{- $full := include "tandemapp.fullname" . }}
# sandbox.mode kubernetes: chatd makes each chat's sandbox a pod in this namespace (chatd/k8s.py).
# The Role is the whole of its API access: pods, their exec and logs, in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-sandbox
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-sandbox
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "tandemapp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# the sandbox pods' own account: no Role, no token (the controller's token is never handed to
# code a chat runs)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-sandbox
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat-sandbox
automountServiceAccountToken: false
---
# a sandbox pod: nothing reaches it (exec goes through the kubelet, not the pod network); it
# reaches only chatd's egress proxy in the controller's pod. No DNS: the proxy resolves names
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-sandbox
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tandemapp.sandboxLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "tandemapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - port: {{ .Values.sandbox.kubernetes.egressPort }}
          protocol: TCP
---
# the controller's egress port: from this release's sandbox pods only. Policies add up: with
# networkPolicy.enabled the controller's own policy admits its HTTP port; without it this policy
# would isolate the pod, so it admits the HTTP port from anywhere, as before
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-egress
  labels:
    {{- include "tandemapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tandemapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tandemapp.sandboxLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.sandbox.kubernetes.egressPort }}
          protocol: TCP
    {{- if not .Values.networkPolicy.enabled }}
    - ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
