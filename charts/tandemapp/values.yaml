# TandemApp's controller on Kubernetes: one pod with the controller (gateway, usage ledger, fleet,
# page) and, once Chat is on, its chatd as a child process. The defaults are bare (OPS-288): the
# gateway only, no chat, no conductor, no MCP bridge; each is switched on from the page or here. No image is built: a stock Python
# image runs the code of a release archive that an init container unpacks into the volume, with a
# virtualenv made there from the archive's own wheels (scripts/make-archive.sh builds the archive).

# -- the stock image every container runs (controller, init, bridge, test). Python 3.11 or newer
# with tar and the system CA bundle; pin the digest.
image:
  repository: docker.io/library/python
  tag: "3.12.12-slim-bookworm"
  digest: "sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- the release the pod runs: an archive `tandemapp-<id>.tar.gz` holding one folder `<id>/` with
# the source tree, the built page (dashboard/dist) and a wheelhouse/ for the virtualenv
release:
  # the release's id (the folder in the archive; the commit's short hash). Required.
  id: ""
  # where the init container gets the archive. With url empty it waits until the file
  # `<persistence.mountPath>/incoming/tandemapp-<id>.tar.gz` is there (copy it in with the
  # `kubectl cp` line NOTES prints), for at most waitSeconds, then fails and the pod retries.
  archive:
    url: ""
    # the archive's sha256: required with url, checked when set
    sha256: ""
    waitSeconds: 1800
  # what the virtualenv gets, from the archive's wheelhouse only (no index is asked)
  requirements:
    - cryptography
    - psutil

# -- the volume: state (config, ledger, fleet, secrets.key), chat data, the releases, the conductor's
# documents and the bridge's own files. One volume, ReadWriteOnce: one replica.
persistence:
  # mounted at this path in every container. With sandbox.mode podman-socket it must equal
  # hostPath.path: chatd hands the host's Podman paths under it as bind mounts.
  mountPath: /var/lib/tandemapp
  # an existing claim (nothing below is made)
  existingClaim: ""
  # a dynamic claim (when hostPath.path is empty)
  storageClass: ""
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  # a single-node cluster may pin the data to a host folder: the chart makes a PersistentVolume
  # (hostPath, Retain, the storage class below) bound to its claim. Uninstalling keeps the folder.
  hostPath:
    path: ""
    # the node that has the folder (nodeAffinity of the volume); empty: any
    node: ""
  # the claim survives `helm uninstall` (resource policy keep)
  keep: true

# -- the controller (`tandem-app serve` through packaging/linux/tandem-app.sh)
controller:
  port: 8091
  # variables of the controller's process (the env file of packaging/app.env.example, as a map).
  # TANDEM_HOST, TANDEM_PORT, TANDEM_APP_STATE and TANDEM_CONDUCTOR are set by the chart. Backends
  # are added here (TANDEM_BACKENDS ...) or on the page; their keys are stored in the config
  # database under the controller's own master key, never here.
  env:
    TANDEM_NODE_AGENT: "off"
  # variables from existing Secrets or ConfigMaps (envFrom entries)
  extraEnvFrom: []
  # more env entries (valueFrom allowed)
  extraEnv: []
  # the conductor's documents: a path under the volume, an absolute path, or "off". Empty (the
  # default, OPS-288): off on a new install, the running controller's on an upgrade, so a
  # changed default never flips a running release. Switched on and off from the page too
  # (Settings, App, What runs here), which wins from then on.
  conductor: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 3Gi
  probes:
    startup:
      failureThreshold: 60
      periodSeconds: 5
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# -- sign-in. Never put a token or a code in a values file.
#   legacy (the default for now): the admin password (TANDEM_ADMIN_TOKEN, at least 32
#     characters) from the Secret below, in the controller's environment. Without one every
#     route answers anyone who reaches it.
#   accounts: user accounts, sessions and API tokens (TANDEM_AUTH=accounts). No auth secret goes
#     into the pod's environment. The Secret is mounted as a file and holds a one-time setup code
#     that makes the first owner; a release that had an admin token keeps that Secret, its value
#     works once as the setup code and, once an owner exists, as an API token for scripts that
#     ends after 30 days. Kubernetes never trusts the pod's loopback (kubectl port-forward).
auth:
  mode: legacy
  # the admin token's Secret, or one the chart makes with a random value (kept across upgrades:
  # 48 characters in legacy mode, a 20-character setup code in accounts mode)
  existingSecret: ""
  secretKey: admin-token
  create: true
  # accounts mode only: the setup code's own Secret (secretKey: its key, empty: auth.secretKey).
  # Empty: the Secret above, so an upgrade keeps its admin token working. create empty:
  # auth.create. With no Secret at all the first code is in the controller's log, or
  # `users setup-code` through kubectl exec (NOTES)
  bootstrap:
    existingSecret: ""
    secretKey: ""
    create: null
  # the addresses of proxies in front whose X-Forwarded-Proto and X-Real-IP count
  # (TANDEM_TRUSTED_PROXY, a comma list of exact addresses, no ranges): the ingress controller
  # when it ends TLS, else every API token through it counts as sent without https
  trustedProxy: ""

# -- Chat: who runs chatd. off: nobody, the Chat tab says Chat is off until an admin switches it
# on from the page (Settings, App, What runs here: chatd then runs in this pod with the env file
# below). own: this pod's controller starts and watches chatd, with the variables below as its env
# file (<state>/chatd.env, written by the init container at every start). external: another host
# does (the Chat tab forwards to QSE_CHAT_URL). Empty (the default, OPS-288): off on a new install,
# the running controller's mode on an upgrade. The page's switch wins over this value once used.
chat:
  mode: ""
  # chatd's data folder under the volume (QSE_CHAT_DATA)
  dataDir: data/chat
  # more lines of chatd.env (QSE_CHAT_MAX_RUNS, QSE_SANDBOX_MEM_GB, ...), as a map
  env: {}

# -- the chat sandboxes (one container per chat, chatd/sandbox.py)
sandbox:
  # off: no sandbox runtime; a chat's sandbox tools say so
  # podman-socket: a rootless Podman socket on the node (ops/sandbox/install.sh), mounted into the
  #   pod. Needs persistence.hostPath.path == persistence.mountPath, and the socket's ACL open to
  #   podSecurityContext.runAsUser.
  # kubernetes: chatd makes each chat's sandbox a pod in this namespace through the Kubernetes API
  #   (chatd/k8s.py). Needs chat.mode own or off (switched on from the page). The image must be on
  #   the node (ops/sandbox/build-k8s.sh)
  mode: "off"
  podmanSocket:
    # the folder on the node that holds podman.sock (/run/user/<uid>/podman)
    hostDir: ""
  kubernetes:
    # the sandbox image, put on each node by ops/sandbox/build-k8s.sh (built in the cluster,
    # imported into the node's containerd): never pulled, so Never by default
    image: tandem-sandbox:1
    imagePullPolicy: Never
    # labels every sandbox pod carries (with app.kubernetes.io/instance; the NetworkPolicies
    # select them)
    podLabels:
      app.kubernetes.io/component: chat-sandbox
    # a RuntimeClass for stronger isolation (gVisor, Kata) where the cluster has one; chatd's
    # start check refuses a class that does not exist
    runtimeClassName: ""
    # false: a user namespace per sandbox pod (uid 1000 in the pod is not the node's uid 1000),
    # and the 512-process limit applies per pod. Needs Kubernetes 1.33+ with a runtime and
    # kernel that support it; true where they do not (the node's podPidsLimit is then the only
    # process limit)
    hostUsers: false
    # the user the sandbox's processes run as (the image's `agent`)
    runAsUser: 1000
    # per sandbox: memory in GiB (request and limit; empty: chatd's default, 2 on a host without
    # the engine) and CPUs (limit)
    memoryGiB: ""
    cpus: 4
    # at most this many sandbox pods at once (empty: chatd's default, 2)
    maxRunning: ""
    # chatd's egress proxy in the controller's pod: the only place a sandbox pod may connect to
    egressPort: 3128
    # the plugin host's egress proxy in the controller's pod, for the plugins' sandbox pods
    # (SRV-859); each proxy refuses a pod that is not one of its own
    pluginEgressPort: 3129

# -- a stdio MCP server served as streamable HTTP on the pod's loopback (files/mcp-stdio-http.py),
# a sidecar. chatd's MCP servers reach it at http://127.0.0.1:<port><path>. The command is a
# program on the volume (put there by the operator) with its own login in its own folder.
mcpBridge:
  enabled: false
  name: tools
  port: 8031
  path: /mcp
  # the program and its arguments, e.g. ["/var/lib/tandemapp/mcp/bin/server", "--stdio"]
  command: []
  env: {}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

# -- extra CA certificates trusted by every container (SSL_CERT_FILE = system bundle + these)
trust:
  # PEM text
  extraCA: ""
  # or a ConfigMap with the PEM
  existingConfigMap: ""
  configMapKey: ca.pem

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  host: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
  # TLS secrets for the host (empty: plain HTTP, e.g. behind a front that ends TLS)
  tls: []
  # paths routed to a Service with no endpoints (503): chatd's engine gateway is for chatd inside
  # the pod only, a plugin's backend for the controller's own relay
  blockedPaths:
    - /chat-engine
    - /plugin-backends
  # the API paths, per protocol: true routes them, false adds them to the blocked paths.
  # openai: /v1/chat/completions, /v1/completions, /v1/embeddings, /v1/responses, /v1/cache.
  # anthropic: /v1/messages (the Messages API). /v1/models is always routed (the page reads it).
  # Empty: routed in legacy mode; in accounts mode blocked on a new install and as the running
  # release had it on an upgrade (a release before accounts routed every path). The page's API
  # exposure switch still decides who may call; this only says whether the ingress gets there.
  # The page's Playground on a backend posts to /v1/chat/completions too: openai false blocks it.
  api:
    openai: ""
    anthropic: ""

# -- who may reach the controller's port. Off: anyone in the cluster.
networkPolicy:
  enabled: false
  # namespaces whose pods may connect (the ingress controller's)
  ingressNamespaces: []
  # more `from` entries (ipBlock for a node, a front, ...)
  extraFrom: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 40
